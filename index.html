<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Family Tree</title>
<style>
  :root{--harris:#3a6ea5;--maxfield:#3a8f5a;--root:#b8860b;--ink:#2c2c2a;--paper:#f5f3ec;--gold:#c9962b;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#e9e6dc;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);overflow:hidden;}
  #stage{position:fixed;inset:0;cursor:grab;touch-action:none;}
  #stage.drag{cursor:grabbing;}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;}
  svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;transform-origin:0 0;}
  .tile{position:absolute;width:158px;min-height:78px;border-radius:11px;background:var(--paper);
        border:2px solid var(--harris);box-shadow:0 2px 7px rgba(0,0,0,.18);padding:8px 10px;
        cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:left .42s cubic-bezier(.4,1,.5,1),top .42s cubic-bezier(.4,1,.5,1),box-shadow .12s,transform .1s;}
  .tile:hover{box-shadow:0 6px 16px rgba(0,0,0,.28);z-index:3;}
  .tile.maxfield{border-color:var(--maxfield);}
  .tile.root{border-color:var(--root);background:#fffaf0;}
  .tile.living{border-style:dashed;background:#eef0ea;}
  .tile.flash{animation:flash 1s ease;}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(201,150,43,.95);}100%{box-shadow:0 0 0 16px rgba(201,150,43,0);}}
  .tile .face{position:absolute;right:8px;top:8px;width:30px;height:30px;opacity:.5;}
  .facepic{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:7px;object-fit:cover;border:1px solid #d8d0bc;box-shadow:0 1px 3px rgba(0,0,0,.22);background:#e9e3d4;}
  .facepic.failimg{display:none;}
  .tile .nm{font-weight:700;font-size:13px;line-height:1.12;max-width:120px;}
  .tile .sub{font-size:11px;color:#6b6860;}
  .tile .docs{margin-top:3px;font-size:10px;color:#9a8;}
  .tile .pill{display:inline-block;background:#ece7d6;border-radius:6px;padding:0 5px;margin:1px 1px 0 0;color:#7a6;}
  .pip{position:absolute;left:50%;top:-15px;transform:translateX(-50%);background:var(--gold);color:#fff;
       border:2px solid var(--paper);border-radius:13px;height:24px;min-width:30px;padding:0 7px;font-size:12px;font-weight:700;
       display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:4;}
  .pip:hover{background:#b5841f;}
  .tile.hasup .pip{display:flex;}
  .tile.hasup{box-shadow:0 2px 7px rgba(201,150,43,.35),0 2px 7px rgba(0,0,0,.12);}

  #top{position:fixed;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:6;pointer-events:none;}
  #top>*{pointer-events:auto;}
  #title{background:rgba(255,255,255,.92);border-radius:10px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:14px;font-weight:700;}
  #search{flex:1;min-width:130px;max-width:260px;border:none;border-radius:10px;padding:9px 12px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .btn{border:none;border-radius:10px;background:rgba(255,255,255,.92);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:9px 12px;color:var(--ink);}
  .btn:hover{background:#fff;}
  #ctl{position:fixed;right:12px;bottom:58px;display:flex;flex-direction:column;gap:6px;z-index:6;}
  #ctl .btn{width:40px;height:40px;font-size:20px;padding:0;}
  #prog{position:fixed;left:12px;bottom:12px;background:rgba(255,255,255,.93);border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:6;min-width:210px;}
  #prog .bar{height:6px;border-radius:4px;background:#e0dac9;margin-top:5px;overflow:hidden;}
  #prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--harris),var(--maxfield));width:0;transition:width .5s;}
  #prog b{color:var(--gold);}
  #fact{position:fixed;right:12px;bottom:12px;max-width:330px;background:rgba(255,250,240,.96);border:1px solid #e7dcc2;border-radius:10px;padding:9px 13px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:6;cursor:pointer;line-height:1.35;}
  #fact b{color:var(--maxfield);} #fact .h{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#b9a;}
  #modal{position:fixed;inset:0;background:rgba(20,18,14,.5);display:none;align-items:center;justify-content:center;z-index:9;}
  #card{background:var(--paper);max-width:430px;width:92%;border-radius:16px;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.4);max-height:88vh;overflow:auto;}
  #card h2{margin:.1em 0 .15em;font-size:22px;}
  #card .meta{color:#6b6860;font-size:14px;margin-bottom:8px;}
  #card .rel{display:inline-block;background:#efe7d3;border-radius:20px;padding:2px 10px;font-size:12px;color:#7a6a45;margin-bottom:12px;}
  #card .dh{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#a99;margin:6px 0;}
  #card .dt{display:flex;flex-wrap:wrap;gap:8px;}
  .doc{background:#fff;border:1px solid #e2dcc9;border-radius:10px;padding:10px 12px;font-size:14px;display:flex;align-items:center;gap:8px;cursor:default;min-width:120px;color:var(--ink);text-decoration:none;}
  .doc .ic{font-size:20px;} .doc .est{color:#b08;font-size:11px;}
  .doc.open{cursor:pointer;} .doc.open:hover{border-color:#3a6ea5;background:#f3f8ff;}
  .doc.locked{opacity:.62;} .doc .go{margin-left:auto;font-size:11px;color:#3a6ea5;font-weight:600;} .doc .go.lk{color:#b09;font-weight:400;font-style:italic;}
  #card .cardface{float:right;width:66px;height:66px;border-radius:10px;object-fit:cover;margin:0 0 8px 12px;border:1px solid #d8d0bc;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  #card .none{color:#8a857a;font-style:italic;font-size:14px;}
  /* clickable document viewer */
  #docview{position:fixed;inset:0;background:rgba(20,18,14,.62);display:none;align-items:center;justify-content:center;z-index:11;padding:16px;}
  .docsheet{background:#fbf7ea;max-width:580px;width:96%;max-height:90vh;overflow:auto;border-radius:8px;box-shadow:0 14px 50px rgba(0,0,0,.5);font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;position:relative;border:1px solid #d8cba6;}
  .docsheet .dx{position:absolute;top:7px;right:13px;font-size:25px;color:#fff;cursor:pointer;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2;}
  .docsheet .band{padding:14px 20px;color:#fff;background:linear-gradient(135deg,#6b5a3e,#8a7448);}
  .docsheet .band .ty{font-size:12px;text-transform:uppercase;letter-spacing:2px;opacity:.88;}
  .docsheet .band .so{font-size:17px;font-weight:600;margin-top:3px;line-height:1.25;}
  .docsheet .body{padding:16px 22px 6px;}
  .docscan{padding:14px;background:#2c2820;text-align:center;}
  .docscan img{max-width:100%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);}
  .docscan .cap{color:#cdbf9a;font-size:12px;margin-top:8px;font-style:italic;}
  table.fld{width:100%;border-collapse:collapse;font-size:14.5px;}
  table.fld td{padding:6px 4px;border-bottom:1px solid #ece2c8;vertical-align:top;}
  table.fld td.k{color:#8a7748;width:42%;font-size:13px;}
  table.fld td.v{color:#2c2c2a;font-weight:500;}
  .hh{margin-top:14px;}
  .hh h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#8a7748;}
  table.hht{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.hht th{text-align:left;color:#a99;font-size:11px;text-transform:uppercase;border-bottom:1px solid #d8cba6;padding:3px 5px;}
  table.hht td{padding:4px 5px;border-bottom:1px solid #f0e8d4;}
  table.hht tr.me td{background:#fbf3d8;font-weight:600;}
  .docfoot{padding:10px 22px 16px;font-size:12px;color:#9a8f78;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .docfoot a{color:#3a6ea5;text-decoration:none;font-weight:600;}
  .docfoot .tag{font-style:italic;}
  #card .x{float:right;cursor:pointer;font-size:22px;color:#aaa;line-height:1;margin-left:10px;}
  #card .locked{margin-top:6px;color:#8a857a;font-size:13px;}
  #card .nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  #card .nav .btn{font-size:13px;padding:9px 13px;box-shadow:none;border:1px solid #e2dcc9;background:#fff;}
  #card .reveal{background:var(--gold);color:#fff;border-color:var(--gold);}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;z-index:11;pointer-events:none;}
  #toast.show{opacity:.95;}
  /* ===== Bloodlines mode ===== */
  #modeSw{display:flex;background:rgba(255,255,255,.92);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow:hidden;}
  .msw{border:none;background:transparent;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:#8a857a;}
  .msw.on{background:var(--gold);color:#fff;}
  #bloodMode{position:fixed;inset:0;display:none;background:#e9e6dc;z-index:2;overflow:hidden;}
  #bLanding{position:absolute;inset:0;overflow:auto;padding:74px 24px 34px;}
  .bIntro{max-width:680px;margin:0 auto 22px;text-align:center;}
  .bIntro h1{font-size:30px;margin:.2em 0;color:var(--ink);}
  .bIntro p{color:#6b6860;font-size:15px;line-height:1.5;}
  .bGrid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;}
  .bCard{text-align:left;background:var(--paper);border:2px solid var(--harris);border-left-width:7px;border-radius:13px;padding:14px 16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14);transition:transform .15s,box-shadow .15s;font:inherit;color:var(--ink);}
  .bCard:hover{transform:translateY(-3px);box-shadow:0 9px 24px rgba(0,0,0,.22);}
  .bCard.maxfield{border-color:var(--maxfield);}
  .bcS{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:700;}
  .bcF{font-size:18px;font-weight:700;margin:2px 0 6px;}
  .bcMeta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:#6b6860;}
  .bcSp{font-size:11.5px;color:#8a857a;font-style:italic;margin-top:5px;}
  #bView{position:absolute;inset:0;display:none;flex-direction:column;padding-top:56px;}
  #bStory{margin:8px 14px 0;background:rgba(255,252,245,.97);border:1px solid #e7dcc2;border-radius:12px;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.14);flex:0 0 auto;max-height:30vh;overflow:auto;}
  #bStory h2{margin:.1em 0 .25em;font-size:19px;}
  #bStory p{font-size:13px;line-height:1.5;color:#4a463e;margin:.3em 0 0;}
  .bBack{float:right;border:none;background:#efe7d3;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:#7a6a45;}
  #bEra{margin:8px 14px 0;display:flex;gap:8px;overflow-x:auto;flex:0 0 auto;padding-bottom:2px;}
  .eraCard{flex:0 0 auto;width:154px;background:var(--paper);border:1px solid #e2dcc9;border-radius:10px;padding:8px 10px;cursor:pointer;transition:width .2s;}
  .eraCard .eraG{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);font-weight:700;}
  .eraCard .eraT{font-size:11.5px;font-weight:700;color:var(--ink);margin:2px 0;line-height:1.2;}
  .eraCard .eraBody{display:none;font-size:11px;color:#5a554c;line-height:1.4;margin-top:4px;}
  .eraCard.open{width:320px;} .eraCard.open .eraBody{display:block;}
  #bStage{position:relative;flex:1;margin-top:8px;cursor:grab;touch-action:none;overflow:hidden;}
  #bStage.drag{cursor:grabbing;}
  #bWorld{position:absolute;left:0;top:0;transform-origin:0 0;}
  #bEdges{position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0;pointer-events:none;}
  .bnode{position:absolute;width:200px;min-height:66px;border-radius:11px;background:var(--paper);border:2px solid var(--harris);box-shadow:0 2px 7px rgba(0,0,0,.18);padding:8px 10px;cursor:pointer;opacity:0;animation:bIn .55s cubic-bezier(.2,1.1,.4,1) forwards;}
  @keyframes bIn{0%{opacity:0;transform:translateX(-24px) scale(.9);}100%{opacity:1;transform:none;}}
  .bnode.maxfield{border-color:var(--maxfield);}
  .bnode.root{border-color:var(--root);background:#fffaf0;}
  .bnode.living{border-style:dashed;background:#eef0ea;}
  .bnode.notable{box-shadow:0 0 0 2px rgba(201,150,43,.45),0 2px 7px rgba(0,0,0,.18);}
  .bnode:hover{box-shadow:0 7px 18px rgba(0,0,0,.3);z-index:3;}
  .bnode .bnm{font-weight:700;font-size:13px;line-height:1.15;}
  .bnode .bsub{font-size:11px;color:#6b6860;}
  .bnode .bsp{font-size:10.5px;color:#8a857a;font-style:italic;}
  .bface{float:right;width:38px;height:38px;border-radius:7px;object-fit:cover;margin-left:8px;border:1px solid #d8d0bc;background:#e9e3d4;}
  #bCtl{position:fixed;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:6;}
  #bCtl .btn{width:40px;height:40px;font-size:20px;padding:0;}
  #card .bnote{margin-top:12px;padding:11px 13px;background:#fbf7ea;border-left:3px solid var(--gold);border-radius:8px;font-size:13.5px;line-height:1.5;color:#4a463e;}
  #card .bdocs{margin-top:8px;font-size:12px;color:#8a7748;}
  @media (prefers-reduced-motion: reduce){ .bnode{animation:none;opacity:1;} }
</style>
</head>
<body>
<div id="top">
  <div id="title">Family Tree &mdash; a mystery</div>
  <div id="modeSw"><button id="mAnc" class="msw on" onclick="setMode('anc')">&#127795; Ancestors</button><button id="mBlood" class="msw" onclick="setMode('blood')">&#127807; Bloodlines</button></div>
  <input id="search" placeholder="Search an ancestor by name…" autocomplete="off">
  <button class="btn" id="surpriseBtn" onclick="surprise()">&#127922; Surprise</button>
</div>
<div id="ctl"><button class="btn" onclick="zoom(1.25)">+</button><button class="btn" onclick="zoom(.8)">&minus;</button><button class="btn" onclick="fitAll()" title="Fit the whole tree on screen">&#9974;</button><button class="btn" onclick="home()" title="Back to the start">&#8962;</button></div>
<div id="stage"><svg id="edges"></svg><div id="world"></div></div>
<div id="prog"><span id="progtxt"></span><div class="bar"><i id="progbar"></i></div></div>
<div id="fact" onclick="factGo()"><span class="h">Did you know?</span><br><span id="facttxt"></span></div>
<div id="modal" onclick="if(event.target.id==='modal')closeModal()"><div id="card"></div></div>
<div id="docview" onclick="if(event.target.id==='docview')closeDoc()"></div>
<div id="toast"></div>

<div id="bloodMode">
  <div id="bLanding"></div>
  <div id="bView">
    <div id="bStory"></div>
    <div id="bEra"></div>
    <div id="bStage"><svg id="bEdges"></svg><div id="bWorld"></div></div>
    <div id="bCtl"><button class="btn" onclick="bZoom(1.2)">+</button><button class="btn" onclick="bZoom(.83)">&minus;</button><button class="btn" onclick="bFit()" title="Fit to screen">&#9974;</button></div>
  </div>
</div>

var HISTORY = /*__HIST_START__*/[{"key":"thury-6835","founderStory":"John Francis Thury Jr was born in 1941 in St. Paul, Minnesota — a third-generation American whose Thury grandfather, George, had crossed the Atlantic around 1900 from Feltorony (today Halbturn) in German-speaking Hungary and settled among St. Paul's tight-knit \"Heideboden\" immigrant community on the city's North End. By John Jr's day the family was fully woven into the Twin Cities; he grew up through World War II and the postwar boom, married Charlene Davis (whose people had come up from Missouri), and raised the family whose line runs straight down to today.","generationCards":[{"gen":0,"era":"The 1940s — wartime St. Paul & the postwar boom","text":"A child born in St. Paul in 1941 came into a city mobilized for World War II — ration books, war-bond drives, and the rail yards and packing houses running full tilt. The peace that followed brought the great postwar boom: steady union work, new cars, television, and the first families leaving the dense old North End for roomier neighborhoods."},{"gen":1,"era":"The 1970s — a changing America","text":"Those coming of age around the 1970s grew up amid Vietnam, the moon landings, the oil crises, and rapid social change. In the Twin Cities this was the era of new freeways and suburbs, the decline of the old downtown industries, and a confident, modern middle-class childhood a world away from the immigrant North End of two generations before."},{"gen":2,"era":"The 1990s — the digital dawn","text":"The generation born around the 1990s grew up as the internet arrived in homes, the Cold War ended, and the Twin Cities reinvented around technology, medicine, and retail. The old-country origins were now a name and a few stories — the immigrant journey had become a fully American one."},{"gen":3,"era":"The 2020s — the present family","text":"The youngest here are today's children, born into a smartphone-and-streaming world, the great-grandchildren and beyond of a line that began on the Hungarian plain and put down deep roots in Minnesota."}],"personNotes":[{"id":"I350063586835","note":"Born in St. Paul in 1941, John Jr. was a wartime and postwar child — the third American generation of a family that had arrived from German-speaking Hungary, now fully at home in the Twin Cities. His life (1941–2017) traced the family's full passage into mainstream mid-century American life."}]},{"key":"maxfield-6329","founderStory":"Richard Moyer Maxfield, born in 1932, carries a New England-rooted line: the Maxfields trace to Frank Maxfield of Copake in Columbia County, New York (b. 1862), and the Moyers likewise came out of New York's Hudson Valley. Richard came of age through the Great Depression and the Second World War, part of the generation that would carry mid-century America into its long postwar prosperity, and his line runs down through the family to the present day.","generationCards":[{"gen":0,"era":"The 1930s — the Great Depression","text":"A child born in 1932 entered the depths of the Great Depression, when roughly a quarter of American workers were unemployed and families learned to make do with very little. It was a hard, formative decade of breadlines and New Deal public works — and the generation it shaped would soon be called to fight World War II."},{"gen":1,"era":"The 1950s — postwar prosperity","text":"Those born around the 1950s grew up in the confident heart of postwar America — new suburbs, big cars with tail fins, television in the living room, and the space race in the headlines. It was the era of the baby boom, interstate highways, and a fast-rising middle-class standard of living."},{"gen":2,"era":"The 1980s — the modern era","text":"The generation of the 1980s came up with personal computers, cable television, and the late Cold War — a recognizably modern America. By now the family's New York and old-stock origins were several generations back, woven into a broad American story."},{"gen":3,"era":"The 2020s — the present family","text":"The youngest here are today's children, the living end of a line that began in the Hudson Valley of New York and reaches all the way to the present family."}],"personNotes":[]},{"key":"mccollum-6950","founderStory":"Lloyd Lee McCollum was born in 1929 in Los Angeles, California — his McCollum line having migrated west a generation earlier from Newcomerstown in Tuscarawas County, Ohio (Otis McCollum, b. 1868). Lloyd was a child of the Depression and the Second World War, growing up as Southern California boomed into one of the fastest-growing corners of the country; his line runs down through the family to today.","generationCards":[{"gen":0,"era":"The late 1920s — boom, then bust","text":"A child born in Los Angeles in 1929 arrived just as the Roaring Twenties gave way to the Wall Street Crash and the Great Depression. Southern California was already booming with oil, aircraft, and the new movie industry, drawing migrants west — but the 1930s would test every family's resilience before World War II remade the region's economy."},{"gen":1,"era":"The 1950s — California's golden age","text":"Those born around the 1950s grew up in California's postwar golden age — aerospace and defense jobs, brand-new suburbs and freeways, backyard pools, and a booming population pouring into the Sunbelt. It was an optimistic, fast-growing world a long way from the family's quiet Ohio origins."},{"gen":2,"era":"The 1980s — the modern era","text":"The 1980s generation came up with personal computers, MTV, and the late Cold War. California sat at the center of the new technology economy, and the family — three generations removed from Ohio — was fully part of modern American life."},{"gen":3,"era":"The 2020s — the present family","text":"The youngest here are today's children, the living continuation of a line that ran from rural Ohio to Southern California and on to the present family."}],"personNotes":[{"id":"MXI130077606950","note":"Born in Los Angeles in 1929, Lloyd grew up through the Depression and World War II as Southern California boomed; the McCollums had come west from Newcomerstown, Ohio a generation before. His life (1929–1989) spanned California's great mid-century rise."}]},{"key":"harris-6831","founderStory":"Kennon Nelson Harris was born in 1942 in Burlington, Iowa — a busy Mississippi River railroad and manufacturing town. The Harris paternal line is documented only as far as his father, Kennon Raymond Harris (b. 1920 in Chetek, Wisconsin) — a genealogical wall beyond that point. Kennon Nelson grew up in wartime and postwar Iowa, and his line carries down through his son Michael to the present family.","generationCards":[{"gen":0,"era":"The 1940s — wartime on the Mississippi","text":"A child born in Burlington, Iowa in 1942 came into a river town hard at work for the war effort — rail yards, river barges, and the huge Iowa Ordnance Plant nearby turning out munitions. The postwar years brought steady factory work, new cars, and the optimism of mid-century small-city America."},{"gen":1,"era":"The 1960s — postwar America","text":"Those born around the 1960s grew up amid the space race, the civil-rights movement, and television — a confident, modernizing America. For a river-town Iowa family this was the era of solid working- and middle-class life, with the wider world arriving nightly on the evening news."},{"gen":2,"era":"The 1990s — the digital dawn","text":"The generation of the 1990s came up as the internet reached homes and the Cold War ended — the start of today's connected world. This is the generation that would bridge the family's Midwestern roots to the present."},{"gen":3,"era":"The 2020s — the present family","text":"The youngest here are today's children, the living end of the Harris line as it is presently documented."}],"personNotes":[{"id":"I350063586831","note":"Born in Burlington, Iowa in 1942, Kennon Nelson grew up in a wartime-and-postwar Mississippi River town; the Harris line is documented just one generation above him, to his father in Wisconsin. He lived from 1942 to 1996."},{"id":"I350063586830","note":"Born in Burlington, Iowa in 1969, Michael came of age in the 1970s–80s Midwest and married into the St. Paul Thury family, joining the two lines. He lived from 1969 to 2017."}]}]/*__HIST_END__*/;

(function(){
  var moved=false;

  function tileHtml(n){

        el.querySelector('.pip').onclick=function(ev){ev.stopPropagation();reveal(id);};

      el.style.left=px+'px'; el.style.top=py+'px';

        var ax=a._px+79,ay=a._py+78,bx=b._px+79,by=b._py,my=(ay+by)/2;

  function reveal(id){
    var ps=(parents[id]||[]).filter(function(p){return byId[p];});
    var added=0; ps.forEach(function(p){if(!shown.has(p)){shown.add(p);added++;}});

  window.home=function(){var n=byId[ROOT];st.z=.82;if(n&&n._px!=null){st.x=innerWidth/2-(n._px+79)*st.z;st.y=innerHeight*0.78-(n._py+40)*st.z;}apply();};
  window.fitAll=function(){var W=parseFloat(world.style.width)||1,H=parseFloat(world.style.height)||1;st.z=Math.max(.1,Math.min(1,Math.min(innerWidth/W,(innerHeight-100)/H)*0.92));st.x=(innerWidth-W*st.z)/2;st.y=(innerHeight-H*st.z)/2+30;apply();};

  var stage=document.getElementById('stage'),down=false,lx,ly,sx0,sy0;
  stage.addEventListener('pointerdown',function(e){down=true;moved=false;lx=sx0=e.clientX;ly=sy0=e.clientY;});
  window.addEventListener('pointermove',function(e){if(!down)return;if(!moved&&Math.abs(e.clientX-sx0)+Math.abs(e.clientY-sy0)>4){moved=true;stage.classList.add('drag');}if(moved){st.x+=e.clientX-lx;st.y+=e.clientY-ly;lx=e.clientX;ly=e.clientY;apply();}});
  window.addEventListener('pointerup',function(){down=false;stage.classList.remove('drag');setTimeout(function(){moved=false;},0);});

  function updProg(){var got=Array.from(shown).filter(function(id){return byId[id]&&!byId[id].living;}).length;
    document.getElementById('progtxt').innerHTML='&#127795; Revealed <b>'+got+'</b> of '+totalDisc+' ancestors';

<script>
/* ===== Bloodlines mode: browse a descendant line downward, with history ===== */
(function(){

      '<div class="bGrid">'+BL.map(function(b){

      '<button class="bBack" onclick="showBLanding()">&#8592; all bloodlines</button>'+
      '<h2>'+E(line.surname)+' &mdash; '+E(line.founder)+'</h2>'+
      (h.founderStory?'<p>'+E(h.founderStory)+'</p>':'');
    renderEra(h);
    layoutLine(line); renderLine(line); bFit();
  };

  /* ---- era timeline ---- */
  var ERA=null;
  function renderEra(h){
    var cards=(h.generationCards||[]), el=document.getElementById('bEra');
    if(!cards.length){el.innerHTML='';el.style.display='none';return;}
    el.style.display='flex';
    el.innerHTML=cards.map(function(c,i){
      return '<div class="eraCard'+(ERA===i?' open':'')+'" onclick="bEraTap('+i+')">'+
        '<div class="eraG">Generation '+(c.gen+1)+'</div>'+
        '<div class="eraT">'+E(c.era)+'</div>'+
        '<div class="eraBody">'+E(c.text)+'</div></div>';
    }).join('');
  }
  window.bEraTap=function(i){ ERA=(ERA===i?null:i); renderEra(HI[cur.key]||{}); };

  /* ---- layout: generations -> x, siblings stack -> y (tidy, left-to-right) ---- */
  function layoutLine(line){
    bpos={}; var byId={}, kids={};
    line.nodes.forEach(function(n){byId[n.id]=n;kids[n.id]=[];});
    line.nodes.forEach(function(n){if(n.par&&kids[n.par])kids[n.par].push(n.id);});
    var yc=0;
    function walk(id){
      var ch=kids[id]||[], y;
      if(!ch.length){ y=yc++; }
      else { var ys=ch.map(walk); y=(ys[0]+ys[ys.length-1])/2; }
      bpos[id]={x:byId[id].gen,y:y}; return y;
    }
    line.nodes.filter(function(n){return !n.par;}).forEach(function(r){walk(r.id);});
  }

  /* ---- render ---- */
  var bworld,bsvg;
  function renderLine(line){
    bworld=document.getElementById('bWorld'); bsvg=document.getElementById('bEdges');
    var maxx=0,maxy=0;
    line.nodes.forEach(function(n){var p=bpos[n.id];if(!p)return;maxx=Math.max(maxx,p.x);maxy=Math.max(maxy,p.y);});
    var W=(maxx+1)*COLW+60, H=(maxy+1)*(BH+VGAP)+80;
    bworld.style.width=W+'px';bworld.style.height=H+'px';bsvg.setAttribute('width',W);bsvg.setAttribute('height',H);
    line.nodes.forEach(function(n){var p=bpos[n.id];if(!p)return;n._px=p.x*COLW+30;n._py=p.y*(BH+VGAP)+40;});
    var paths='';
    line.nodes.forEach(function(n){
      if(!n.par)return; var a=line.nodes.filter(function(x){return x.id===n.par;})[0]; if(!a||a._px==null)return;
      var ax=a._px+200,ay=a._py+BH/2,bx=n._px,by=n._py+BH/2,mx=(ax+bx)/2;
      paths+='<path d="M'+ax+' '+ay+' H'+mx+' V'+by+' H'+bx+'" fill="none" stroke="#b7ac8e" stroke-width="2"/>';
    });
    bsvg.innerHTML=paths;
    bworld.querySelectorAll('.bnode').forEach(function(e){e.remove();});
    var side=sideOf(line);
    line.nodes.forEach(function(n){
      if(n._px==null)return;
      var el=document.createElement('div');
      el.className='bnode '+side+(n.living?' living':'')+(n.notable?' notable':'')+(n.gen===0?' root':'');
      el.style.left=n._px+'px';el.style.top=n._py+'px';
      el.style.animationDelay=(Math.min(n.gen,6)*0.1)+'s';
      var face=n.face?'<img class="bface" src="'+E(n.face)+'" onerror="this.style.display=\'none\'">':'';
      el.innerHTML=face+'<div class="bnm">'+E(n.label)+'</div>'+
        '<div class="bsub">'+E(n.span||(n.living?'living family':''))+'</div>'+
        (n.spouse?'<div class="bsp">m. '+E(String(n.spouse).split(' ')[0])+'</div>':'');
      el.onclick=function(){ openBPerson(n); };
      bworld.appendChild(el);
    });
  }

  /* ---- person modal (reuses #modal / #card) ---- */
  function openBPerson(n){
    var c=document.getElementById('card'); if(!c)return;
    var h=HI[cur.key]||{}, note=(h.personNotes||[]).filter(function(x){return x.id===n.id;})[0];
    var face=n.face?'<img class="cardface" src="'+E(n.face)+'" onerror="this.style.display=\'none\'">':'';
    c.innerHTML='<span class="x" onclick="closeModal()">&times;</span>'+face+
      '<h2>'+E(n.label)+'</h2>'+
      '<div class="meta">'+E(n.span||'')+(n.place?' &middot; '+E(n.place):'')+'</div>'+
      (n.living?'<span class="rel">Living family</span> ':'')+
      (n.spouse?'<span class="rel">m. '+E(n.spouse)+'</span>':'')+
      (note?'<div class="bnote">'+E(note.note)+'</div>':'')+
      (n.docs?'<div class="bdocs">&#128196; '+n.docs+' document'+(n.docs>1?'s':'')+' on record</div>':'');
    document.getElementById('modal').style.display='flex';
  }

  /* ---- pan / zoom / fit ---- */
  var bs={x:0,y:0,z:1};
  function bapply(){var t='translate('+bs.x+'px,'+bs.y+'px) scale('+bs.z+')';bworld.style.transform=t;bsvg.style.transform=t;}
  window.bFit=function(){
    var st=document.getElementById('bStage'),r=st.getBoundingClientRect();
    var W=parseFloat(bworld.style.width)||1,H=parseFloat(bworld.style.height)||1;
    bs.z=Math.max(.18,Math.min(1,Math.min(r.width/W,r.height/H)*0.94));
    bs.x=Math.max(14,(r.width-W*bs.z)/2); bs.y=16; bapply();
  };
  window.bZoom=function(f){var st=document.getElementById('bStage').getBoundingClientRect();var cx=st.width/2,cy=st.height/2;bs.x=cx-(cx-bs.x)*f;bs.y=cy-(cy-bs.y)*f;bs.z=Math.max(.15,Math.min(2.2,bs.z*f));bapply();};
  (function(){
    var st=document.getElementById('bStage'),down=false,lx,ly,mv;
    st.addEventListener('pointerdown',function(e){down=true;mv=false;lx=e.clientX;ly=e.clientY;});
    window.addEventListener('pointermove',function(e){if(!down)return;mv=true;st.classList.add('drag');bs.x+=e.clientX-lx;bs.y+=e.clientY-ly;lx=e.clientX;ly=e.clientY;bapply();});
    window.addEventListener('pointerup',function(){down=false;st.classList.remove('drag');});
    st.addEventListener('wheel',function(e){e.preventDefault();var f=e.deltaY<0?1.12:0.89;var r=st.getBoundingClientRect();var mx=e.clientX-r.left,my=e.clientY-r.top;bs.x=mx-(mx-bs.x)*f;bs.y=my-(my-bs.y)*f;bs.z=Math.max(.15,Math.min(2.2,bs.z*f));bapply();},{passive:false});
  })();
})();
</script>
</body>
</html>
